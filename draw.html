<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坐标显示器</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #1e1e2e;
    color: #e0e0e0;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* 左侧控制面板 */
  .panel {
    width: 300px;
    padding: 20px;
    background: #262636;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
    border-right: 1px solid #3a3a4a;
  }
  .panel h1 {
    font-size: 18px;
    margin: 0 0 6px;
    color: #7fd4ff;
  }
  .panel label {
    font-size: 13px;
    color: #a0a0b0;
  }
  .row {
    display: flex;
    gap: 10px;
  }
  .row > div { flex: 1; }
  input[type="number"] {
    width: 100%;
    padding: 9px 10px;
    font-size: 15px;
    border-radius: 6px;
    border: 1px solid #3a3a4a;
    background: #1e1e2e;
    color: #e0e0e0;
    outline: none;
  }
  input[type="number"]:focus { border-color: #7fd4ff; }

  button {
    padding: 10px;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #3a7bd5;
    color: #fff;
    transition: background .15s;
  }
  button:hover { background: #4a8bf5; }
  button.secondary { background: #44445a; }
  button.secondary:hover { background: #55556a; }
  button.danger { background: #c0392b; }
  button.danger:hover { background: #e74c3c; }

  .info {
    font-size: 13px;
    color: #a0a0b0;
    background: #1e1e2e;
    padding: 10px;
    border-radius: 6px;
    line-height: 1.6;
  }
  .info b { color: #7fd4ff; }

  .hint { font-size: 12px; color: #777; }

  /* 右侧画布区域 */
  .canvas-wrap {
    flex: 1;
    position: relative;
    background: #16161f;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>

  <div class="panel">
    <h1>📌 坐标显示器</h1>

    <div class="row">
      <div>
        <label>X 坐标</label>
        <input type="number" id="xInput" value="0" step="any">
      </div>
      <div>
        <label>Y 坐标</label>
        <input type="number" id="yInput" value="0" step="any">
      </div>
    </div>

    <button id="addBtn">添加坐标并连线</button>
    <button class="secondary" id="undoBtn">撤销上一个</button>
    <button class="danger" id="clearBtn">清空全部</button>

    <div class="info" id="info">
      上个坐标：<b>—</b><br>
      当前坐标：<b>—</b><br>
      点数：<b>0</b>　线段：<b>0</b>
    </div>

    <div class="hint">
      提示：在右侧画布点击添加坐标点，会自动<b>吸附到整数格点</b>并与上一个点连线。<br>
      鼠标移动可预览吸附位置，滚轮缩放。
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="cv"></canvas>
  </div>

<script>
(function () {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const xInput = document.getElementById('xInput');
  const yInput = document.getElementById('yInput');
  const infoEl = document.getElementById('info');

  // 坐标点列表（世界坐标）
  const points = [];

  // 视图参数
  let scale = 40;     // 每单位像素
  let offsetX = 0;    // 世界原点在画布上的位置
  let offsetY = 0;

  function resize() {
    const rect = cv.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cv.width = rect.width * dpr;
    cv.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 原点放在中心
    offsetX = rect.width / 2;
    offsetY = rect.height / 2;
    draw();
  }

  // 世界坐标 -> 屏幕坐标（Y 轴向上为正）
  function toScreen(x, y) {
    return {
      x: offsetX + x * scale,
      y: offsetY - y * scale
    };
  }
  // 屏幕坐标 -> 世界坐标
  function toWorld(sx, sy) {
    return {
      x: (sx - offsetX) / scale,
      y: (offsetY - sy) / scale
    };
  }

  function drawGrid() {
    const w = cv.clientWidth, h = cv.clientHeight;

    ctx.fillStyle = '#16161f';
    ctx.fillRect(0, 0, w, h);

    // 计算网格间距（自适应）
    let step = 1;
    while (step * scale < 40) step *= 5;
    while (step * scale > 120) step /= 5;

    const startX = Math.floor(toWorld(0, 0).x / step) * step;
    const endX = toWorld(w, 0).x;
    const startY = Math.floor(toWorld(0, h).y / step) * step;
    const endY = toWorld(0, 0).y;

    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.beginPath();
    for (let x = startX; x <= endX; x += step) {
      const p = toScreen(x, 0);
      ctx.moveTo(p.x, 0);
      ctx.lineTo(p.x, h);
    }
    for (let y = startY; y <= endY; y += step) {
      const p = toScreen(0, y);
      ctx.moveTo(0, p.y);
      ctx.lineTo(w, p.y);
    }
    ctx.stroke();

    // 坐标轴
    const origin = toScreen(0, 0);
    ctx.strokeStyle = 'rgba(127,212,255,0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, origin.y);
    ctx.lineTo(w, origin.y);
    ctx.moveTo(origin.x, 0);
    ctx.lineTo(origin.x, h);
    ctx.stroke();

    // 刻度数字
    ctx.fillStyle = 'rgba(180,180,200,0.7)';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (let x = startX; x <= endX; x += step) {
      if (Math.abs(x) < 1e-9) continue;
      const p = toScreen(x, 0);
      ctx.fillText(x, p.x, origin.y + 4);
    }
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let y = startY; y <= endY; y += step) {
      if (Math.abs(y) < 1e-9) continue;
      const p = toScreen(0, y);
      ctx.fillText(y, origin.x - 6, p.y);
    }
  }

  function draw() {
    const w = cv.clientWidth, h = cv.clientHeight;
    drawGrid();

    // 吸附预览：虚线连到上一个点 + 高亮点
    if (hoverPoint) {
      const hs = toScreen(hoverPoint.x, hoverPoint.y);
      const last = points[points.length - 1];
      if (last) {
        const ls = toScreen(last.x, last.y);
        ctx.save();
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = 'rgba(255,212,121,0.7)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(ls.x, ls.y);
        ctx.lineTo(hs.x, hs.y);
        ctx.stroke();
        ctx.restore();
      }
      // 高亮吸附目标
      ctx.beginPath();
      ctx.arc(hs.x, hs.y, 7, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,212,121,0.9)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // 预览坐标文字
      ctx.fillStyle = '#ffd479';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(`(${hoverPoint.x}, ${hoverPoint.y})`, hs.x + 10, hs.y + 8);
    }

    // 连线
    if (points.length > 1) {
      ctx.strokeStyle = '#7fd4ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      points.forEach((pt, i) => {
        const s = toScreen(pt.x, pt.y);
        if (i === 0) ctx.moveTo(s.x, s.y);
        else ctx.lineTo(s.x, s.y);
      });
      ctx.stroke();
    }

    // 点
    points.forEach((pt, i) => {
      const s = toScreen(pt.x, pt.y);
      ctx.beginPath();
      ctx.arc(s.x, s.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd479';
      ctx.fill();
      ctx.strokeStyle = '#1e1e2e';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // 坐标标签
      ctx.fillStyle = '#e0e0e0';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      ctx.fillText(`(${fmt(pt.x)}, ${fmt(pt.y)})`, s.x + 8, s.y - 6);
    });
  }

  function fmt(n) {
    return Number.isInteger(n) ? n : Number(n.toFixed(3));
  }

  function updateInfo() {
    const last = points[points.length - 1];
    const prev = points[points.length - 2];
    infoEl.innerHTML =
      `上个坐标：<b>${prev ? `(${fmt(prev.x)}, ${fmt(prev.y)})` : '—'}</b><br>` +
      `当前坐标：<b>${last ? `(${fmt(last.x)}, ${fmt(last.y)})` : '—'}</b><br>` +
      `点数：<b>${points.length}</b>　线段：<b>${Math.max(0, points.length - 1)}</b>`;
  }

  // 吸附到最近的整数点
  function snap(v) {
    return Math.round(v);
  }

  function addPoint(x, y) {
    points.push({ x: Number(x), y: Number(y) });
    draw();
    updateInfo();
  }

  // 事件绑定
  document.getElementById('addBtn').onclick = () => {
    const x = parseFloat(xInput.value);
    const y = parseFloat(yInput.value);
    if (isNaN(x) || isNaN(y)) {
      alert('请输入有效的数字坐标');
      return;
    }
    addPoint(x, y);
  };

  document.getElementById('undoBtn').onclick = () => {
    points.pop();
    draw();
    updateInfo();
  };

  document.getElementById('clearBtn').onclick = () => {
    points.length = 0;
    draw();
    updateInfo();
  };

  // 回车快速添加
  [xInput, yInput].forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('addBtn').click();
    });
  });

  // 鼠标悬停时的吸附预览点（世界坐标）
  let hoverPoint = null;

  // 画布点击添加（自动吸附到整数点）
  cv.addEventListener('click', e => {
    const rect = cv.getBoundingClientRect();
    const w = toWorld(e.clientX - rect.left, e.clientY - rect.top);
    addPoint(snap(w.x), snap(w.y));
  });

  // 鼠标移动：更新吸附预览
  cv.addEventListener('mousemove', e => {
    const rect = cv.getBoundingClientRect();
    const w = toWorld(e.clientX - rect.left, e.clientY - rect.top);
    const sx = snap(w.x);
    const sy = snap(w.y);
    if (!hoverPoint || hoverPoint.x !== sx || hoverPoint.y !== sy) {
      hoverPoint = { x: sx, y: sy };
      draw();
    }
  });

  cv.addEventListener('mouseleave', () => {
    hoverPoint = null;
    draw();
  });

  // 滚轮缩放
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = cv.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    // 记录鼠标下的世界坐标
    const before = toWorld(mx, my);
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    scale = Math.max(5, Math.min(400, scale * factor));
    // 调整偏移，使鼠标下的点缩放后位置不变
    offsetX = mx - before.x * scale;
    offsetY = my + before.y * scale;
    draw();
  }, { passive: false });

  window.addEventListener('resize', resize);

  resize();
  updateInfo();
})();
</script>
</body>
</html>
